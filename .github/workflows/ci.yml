name: PrivaFlow CI Pipeline

# 1. Trigger: When do we run?
# Run on every push to the 'main' branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Jobs: What tasks do we do?
jobs:
  test-and-build:
    runs-on: ubuntu-latest # The computer the robot uses

    steps:
    # Step A: Download your code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step B: Install Go (Robot needs Go too!)
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25' # Match your local version

    # Step C: Install dependencies
    - name: Download Modules
      run: go mod download

    # Step D: Run the Tests (The moment of truth)
    - name: Run Unit Tests
      run: go test -v ./...

    # Step E: Check if it compiles (Build check)
    - name: Build API
      run: go build -v ./cmd/api